<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-white mb-4">محادثة الذكاء الاصطناعي</h1>
    <p class="text-center text-gray-400 mb-6">أدخل سؤالك أو طلبك المتعلق بالبرمجة أو الهكات</p>
    
    <textarea id="userInput" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg mb-4 text-white focus:outline-none focus:ring-2 focus:ring-gray-500" rows="4" placeholder="مثال: كيف أكتب سكربت بايثون لفحص المنافذ؟"></textarea>
    
    <div class="flex justify-center mb-6">
      <button id="submitBtn" class="bg-white text-gray-900 w-12 h-12 rounded-full flex items-center justify-center hover:bg-gray-200 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

      </button>
    </div>
    
    <div id="response" class="mt-6 p-4 bg-gray-800 rounded-lg hidden">
      <h2 class="text-lg font-semibold text-white">الرد:</h2>
      <p id="responseText" class="text-gray-300"></p>
    </div>
  </div>

  <script>
    const apiKey = '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';
    const submitBtn = document.getElementById('submitBtn');
    const userInput = document.getElementById('userInput');
    const responseDiv = document.getElementById('response');
    const responseText = document.getElementById('responseText');

    submitBtn.addEventListener('click', async () => {
      const prompt = userInput.value.trim();
      if (!prompt) {
        alert('يرجى إدخال نص!');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<svg class="w-6 h-6 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a8 8 0 1116 0A8 8 0 014 12z"></path></svg>';
      responseDiv.classList.add('hidden');

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [{ role: 'user', content: prompt }],
            max_tokens: 500
          })
        });

        if (!response.ok) {
          throw new Error('فشل في الاتصال بالـ API');
        }

        const data = await response.json();
        responseText.textContent = data.choices[0].message.content;
        responseDiv.classList.remove('hidden');
      } catch (error) {
        responseText.textContent = 'حدث خطأ: ' + error.message;
        responseDiv.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
      }
    });
  </script>
