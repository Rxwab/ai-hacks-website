<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - موقع الذكاء الاصطناعي</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-white mb-4">موقع الذكاء الاصطناعي</h1>
    <p class="text-center text-gray-400 mb-6">قم بتسجيل الدخول للوصول إلى المحادثة</p>
    
    <input id="username" type="text" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg mb-4 text-white focus:outline-none focus:ring-2 focus:ring-gray-500" placeholder="اسم المستخدم">
    <input id="password" type="password" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg mb-4 text-white focus:outline-none focus:ring-2 focus:ring-gray-500" placeholder="كلمة المرور">
    
    <div class="flex justify-center mb-6">
      <button id="loginBtn" class="bg-white text-gray-900 w-12 h-12 rounded-full flex items-center justify-center hover:bg-gray-200 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    loginBtn.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        alert('يرجى إدخال اسم المستخدم وكلمة المرور!');
        return;
      }

      // محاكاة تسجيل الدخول (بدون خادم)
      // يمكنك هنا إضافة منطق للتحقق من بيانات المستخدم إذا كنت تستخدم خادمًا
      window.location.href = 'chat.html';
    });
  </script>
</body>
</html>
